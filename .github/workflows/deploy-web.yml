name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href / --no-web-resources-cdn

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          channelId: live
          projectId: aquasave-cae9e
          # Fijada: firebase-tools 15.x fallaba con "No OAuth tokens found"
          # y 403 al leer firebasehosting.googleapis.com usando el mismo
          # service account que ya funcionaba.
          firebaseToolsVersion: "13.29.1"
        env:
          # Evita que el CLI intente resolver el proyecto por otra via.
          GOOGLE_CLOUD_PROJECT: aquasave-cae9e
